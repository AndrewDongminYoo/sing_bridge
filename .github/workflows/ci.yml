name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pronunciation-reference:
    name: Offline pronunciation reference checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/pronunciation-quality/package-lock.json
      - name: Install the pinned offline reading engine
        run: npm ci --ignore-scripts --prefix tools/pronunciation-quality
      - name: Test reading comparisons and baseline failures
        run: npm test --prefix tools/pronunciation-quality
      - name: Check original evaluation fixtures
        run: node tools/pronunciation-quality/evaluate.mjs --check

  jvm-and-android:
    name: JVM tests and Android checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Run JVM tests and Android build checks
        shell: bash
        run: ./gradlew --no-daemon :shared:jvmTest :androidApp:assembleDebug :androidApp:lintDebug

      - name: Test shared YouTube player JavaScript
        run: node --test tools/test-youtube.mjs server/pronunciation.test.mjs

      - name: Test LRCLIB coverage tool
        run: node --test tools/lyrics-coverage/coverage.test.mjs

      - name: Upload Android lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-reports
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

  ios-host:
    name: iOS simulator host build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK packages needed by Gradle configuration
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Select Xcode 26.6 with its installed simulator platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          developer_dir="/Applications/Xcode_26.6.app/Contents/Developer"
          test -x "$developer_dir/usr/bin/xcodebuild"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" xcrun --sdk iphonesimulator --show-sdk-path

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          xcodegen_binary="$(find "$RUNNER_TEMP/xcodegen" -type f -path '*/bin/xcodegen' -print -quit)"
          test -n "$xcodegen_binary"
          echo "$(dirname "$xcodegen_binary")" >> "$GITHUB_PATH"
          "$xcodegen_binary" --version

      - name: Generate and compile the unsigned iOS simulator host
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec iosApp/project.yml
          xcodebuild -project iosApp/SingBridge.xcodeproj -scheme SingBridge -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

  trunk:
    name: Trunk checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trunk checks
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
