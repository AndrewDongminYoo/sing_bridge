version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /tools/pronunciation-quality
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 2
    # sing_bridge#100 (2026-10-27): Compose Multiplatform 1.12 needs compileSdk 37,
    # and Kotlin 2.4 needs a regenerated Kotlin Native bundle lock.
    # Both are separate migrations; patch updates stay open.
    ignore:
      - dependency-name: org.jetbrains.compose
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.compose.*
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlin.multiplatform
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: org.jetbrains.kotlin.plugin.compose
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      gradle-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      gradle-security:
        applies-to: security-updates
        patterns:
          - '*'
