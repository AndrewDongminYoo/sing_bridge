name: SingBridge
options:
  bundleIdPrefix: io.github.andrewdongminyoo
  deploymentTarget:
    iOS: '17.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SingBridge:
    type: application
    platform: iOS
    sources:
      - SingBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.andrewdongminyoo.singbridge
        INFOPLIST_FILE: SingBridge/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: 1,2
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    preBuildScripts:
      - name: Build shared Kotlin framework
        script: |
          set -eu
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
schemes:
  SingBridge:
    build:
      targets:
        SingBridge: all
