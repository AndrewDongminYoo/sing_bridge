# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - python@3.14.4
    - node@22.16.0
    - java@23.0.1
lint:
  definitions:
    - name: ktlint
      commands:
        # The pinned plugin only formats; SARIF also reports non-fixable rules.
        - name: lint
          run: java -Xmx512m -jar ${linter}/ktlint --relative --log-level=none --reporter=sarif "${target}"
          output: sarif
          batch: true
          success_codes: [0, 1]
        - name: format
          platforms: [linux, macos]
          run: java -Xmx512m -jar ${linter}/ktlint -F "${target}"
          output: rewrite
          formatter: true
          in_place: true
          batch: true
          success_codes: [0, 1]
    - name: pinact
      commands:
        - name: upgrade
          enabled: true
  disabled:
    - grype
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.10.1
    - checkov@3.4.3
    - cspell@10.4.1
    - git-diff-check
    - isort@9.0.2
    - ktlint@1.8.0
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - oxipng@10.2.1
    - pinact@4.1.1!
    - prettier@3.9.10
    - ruff@0.17.4
    - shellcheck@0.11.0
    - shfmt@3.14.1
    - taplo@0.10.0
    - trufflehog@3.99.8
    - yamllint@1.38.0
  ignore:
    - linters: [shellcheck, shfmt]
      paths:
        - gradlew
actions:
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
