# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - python@3.14.4
    - node@22.16.0
    - java@23.0.1
lint:
  definitions:
    - name: ktlint
      commands:
        # The pinned plugin only formats; SARIF also reports non-fixable rules.
        - name: lint
          run: java -Xmx512m -jar ${linter}/ktlint --relative --log-level=none --reporter=sarif "${target}"
          output: sarif
          batch: true
          success_codes: [0, 1]
        - name: format
          platforms: [linux, macos]
          run: java -Xmx512m -jar ${linter}/ktlint -F "${target}"
          output: rewrite
          formatter: true
          in_place: true
          batch: true
          success_codes: [0, 1]
  enabled:
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.20
    - git-diff-check
    - grype@0.110.0
    - isort@9.0.2
    - osv-scanner@2.2.4
    - pinact@4.1.1: { commands: [lint, upgrade] }
    - prettier@3.9.9
    - ruff@0.16.9
    - shfmt@3.13.1
    - taplo@0.10.0
    - trufflehog@3.90.13
    - yamllint@1.38.0
    - actionlint@1.7.12
    - markdownlint@0.49.1
    - shellcheck@0.11.0
    - ktlint@1.7.1
  ignore:
    - linters: [shellcheck, shfmt]
      paths:
        - gradlew
actions:
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
